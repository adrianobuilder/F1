[project]
name = "f1"
version = "0.1.0"
description = "Dashboard local de analise historica da Formula 1 com OpenF1"
authors = [
    {name = "Adriano Silva",email = "adrianojsilva86@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.50,<2",
    "plotly>=6,<7",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "pyarrow>=20,<24",
]

[tool.poetry]
packages = [{include = "f1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
ruff = ">=0.17,<0.18"
mypy = ">=2.4,<3"
pandas-stubs = ">=2.2,<3"
pip-audit = ">=2.10,<3"
taskipy = "^1.14.1"

[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
pytest = ">=9.1,<10"
pytest-cov = ">=7.1,<8"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.7,<10"
mkdocstrings = {version = ">=1,<2", extras = ["python"]}

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C90", "RUF"]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.taskipy.tasks]
docs = {cmd = "mkdocs serve -f docs/mkdocs.yml", help = "Inicia a documentacao local"}
docs-build = {cmd = "mkdocs build --strict -f docs/mkdocs.yml", help = "Valida e compila a documentacao"}

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers --strict-config --cov=f1 --cov-report=term-missing --cov-fail-under=50"
markers = ["integration: integracao de componentes locais sem acesso externo", "live: consulta explicita a OpenF1"]
[tool.coverage.run]
source = ["f1"]
branch = false
[tool.coverage.report]
fail_under = 50
show_missing = true
precision = 2

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["plotly.*", "pyarrow.*"]
ignore_missing_imports = true
